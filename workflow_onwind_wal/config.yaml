# SPDX-FileCopyrightText: Contributors to PyPSA-Wal
# SPDX-License-Identifier: MIT
#
# Configuration of the stand-alone Walloon onshore-wind land-eligibility
# workflow.  Every exclusion layer is declared here, with the legal instrument
# it implements, so that the constraint set can be audited without reading a
# single line of Python.
#
# See docs/onwind_potential_wallonia/ for the accompanying report.

version: "1.0"

# ---------------------------------------------------------------------------
# Region of interest
# ---------------------------------------------------------------------------
region:
  # The BEWAL polygon used by the PyPSA-Wal model itself, so that the potential
  # computed here is directly substitutable for the model's p_nom_max.
  shapes: "../resources/regions_onshore_base_s_adm.geojson"
  name: "BEWAL"
  # Fallback if the model resources have not been built: dissolve the Walloon
  # provinces out of the NUTS3 shapes shipped with PyPSA-Eur.
  fallback_shapes: "../resources/nuts3_shapes.geojson"
  fallback_prefix: ["BE3"]          # NUTS-1 code of the Walloon Region

# ---------------------------------------------------------------------------
# Weather data
# ---------------------------------------------------------------------------
atlite:
  cutout: "../cutouts/europe-2013-sarah3-era5.nc"
  nprocesses: 4
  excluder_resolution: 100          # m, the raster on which exclusions are burnt
  crs: 3035                         # ETRS89 / LAEA Europe, equal-area

# ---------------------------------------------------------------------------
# Turbine classes
#
# The three classes mirror the three "scénarios de base" of the 2022
# SPW/Gembloux update of the Walloon favourable-zone map (150 m / 180 m /
# 210 m total tip height), so the two studies can be compared line by line.
# `spacing_crosswind` x `spacing_downwind` are rotor-diameter multiples; the
# resulting capacity density is derived, not assumed.
# ---------------------------------------------------------------------------
turbines:
  T136_V112:
    atlite_model: "Vestas_V112_3MW"
    p_nom: 3.0                      # MW
    hub_height: 80                  # m
    rotor_diameter: 112             # m
    label: "V112 / 3.0 MW (tip 136 m)"
    comment: >-
      PyPSA-Eur's default onshore turbine and a fair proxy for the standing
      Walloon fleet.  Retained so that the baseline of this study reproduces
      the number the model uses today.
  T185_NREL4:
    atlite_model: "NREL_ReferenceTurbine_2020ATB_4MW"
    p_nom: 4.0
    hub_height: 110
    rotor_diameter: 150
    label: "NREL 2020ATB 4.0 MW (tip 185 m)"
    comment: >-
      Reference class.  Closest available match to the "180 m" scenario of the
      2022 Walloon favourable-zone update, and to what is actually being
      permitted in Wallonia since the 2024 reference framework.
  T208_NREL55:
    atlite_model: "NREL_ReferenceTurbine_2020ATB_5.5MW"
    p_nom: 5.5
    hub_height: 120
    rotor_diameter: 175
    label: "NREL 2020ATB 5.5 MW (tip 208 m)"
    comment: >-
      Upper class, matching the "210 m" scenario of the 2022 update.

  spacing_crosswind: 5              # rotor diameters
  spacing_downwind: 7               # rotor diameters

reference_turbine: "T185_NREL4"

# Capacity densities carried through every scenario, in MW/km^2 of eligible
# land.  `derived` is replaced at run time by p_nom / (5D x 7D).
capacity_densities:
  pypsa_eur: 3.0                    # PyPSA-Eur's config.default.yaml value
  derived: null                     # computed from the turbine geometry
  dense: 8.0                        # 4D x 6D packing, upper bound

reference_density: "derived"

# ---------------------------------------------------------------------------
# Turbine placement
#
# The headline capacity of this study comes from placing machines on the
# eligible raster under a minimum inter-turbine distance, not from multiplying
# area by a density.  `bregilab_spacing_rotor_diameters` is the rule of the
# VITO Dynamic Energy Atlas (5 D), carried so that the two studies can be
# compared on identical ground; the reference spacing is the isotropic
# equivalent of the 5D x 7D array, sqrt(5 x 7) D = 5.92 D.
# ---------------------------------------------------------------------------
placement:
  # ------------------------------------------------------------------
  # Minimum distance between machines, in rotor diameters.
  #
  # `crosswind` (5 D) is the reference.  It is the *nearest-neighbour* distance
  # of the 5D x 7D array the capacity-density convention is built on: in that
  # array the closest pair is 5 D apart, not sqrt(5x7) D.  Converting an
  # area-per-turbine into an isotropic minimum separation forbids exactly the
  # pairs the convention itself contains, and it assumes a two-dimensional
  # array — whereas Walloon wind farms are predominantly strings along a road
  # or a field boundary, where no downwind row exists and the 7 D never binds.
  # 5 D is also the rule the VITO Dynamic Energy Atlas uses.
  #
  # `observed` (4.3 D) is the median nearest-neighbour distance of the 652
  # machines standing in Wallonia, at the ~100 m rotor typical of that fleet
  # (median 427 m; p25 362 m; p10 306 m).
  # `isotropic` (sqrt(5x7) = 5.92 D) is the area-equivalent, retained as the
  # conservative end.
  # The physical floor is about 3 D: below that, wake-induced turbulence takes
  # a machine outside the IEC 61400-1 standard load case.
  # ------------------------------------------------------------------
  spacings_rotor_diameters:
    observed: 4.3
    crosswind: 5
    isotropic: 5.916        # sqrt(5 x 7)
  reference_case: "crosswind"
  # The reference is the farm model with the open-horizon criterion: the
  # geometry calibrated on the standing fleet, and the landscape rule the 2013
  # framework actually states rather than the indicative distance it also
  # mentions.
  reference_model: "farm+horizon"
  # Single-linkage distance used to test whether the free allocation is a
  # scatter of isolated machines.  It is not: at this link the carpet chains
  # into a handful of very large groups, which is the point.
  group_link_m: 2600
  # ------------------------------------------------------------------
  # The farm level.
  #
  # `radius_m` and the reference `interfarm_distance_m` are calibrated on the
  # 652 machines standing in Wallonia, not taken from a rule.  Grouped by
  # single linkage at 1.5 km they form 134 farms whose radius has median 815 m,
  # p75 1 309 m and p90 1 561 m, and whose centre-to-centre nearest-neighbour
  # distance has p5 1.91 km, p10 2.34 km, p25 3.00 km and median 4.56 km.
  # A radius of 1 300 m (the observed p75) with farms not allowed to overlap
  # gives an inter-farm distance of 2 600 m, which sits inside the observed
  # p10-p25 band: the model forbids no configuration Wallonia has actually
  # permitted.
  #
  # `min_turbines: 4` is *not* applied as a legal rule.  The 2024 framework
  # defines a parc éolien as at least four machines, but with explicit
  # reductions for repowering, for extensions of an existing park, and for
  # machines above 3.2 MW — which the reference class is.  It is applied
  # because it describes how Walloon wind is actually built: 86 % of the
  # standing machines are in groups of four or more.
  #
  # The 4-6 km values are a *2013-legacy policy* sensitivity, not the
  # reference.  See `landscape` below.
  # ------------------------------------------------------------------
  farm:
    interfarm_distance_m: [2600, 4000, 5000, 6000]
    reference_interfarm_distance_m: 2600
    radius_m: 1300
    min_turbines: 4

  # ------------------------------------------------------------------
  # The landscape criterion, as the 2013 cadre de référence actually states it:
  #
  #   "Sauf lorsque les éoliennes sont implantées le long des autoroutes, une
  #    référence indicative à une inter-distance minimale de 4 km à 6 km, en
  #    fonction des résultats de l'étude d'incidence sera prise en
  #    considération. Un azimut (ou un angle horizontal) minimal sans éoliennes
  #    doit être préservé pour chaque village ; celui-ci sera d'au moins 130°,
  #    sur une distance de 4 km. Un examen de l'encerclement sera réalisé sur
  #    une distance de 9 km dans le cadre de l'EIE."
  #
  # Three things follow.  The 4-6 km inter-distance is *indicative*, is subject
  # to the impact assessment, and does not apply along motorways — which is
  # where the Walloon zoning rule concentrates the eligible land in the first
  # place.  The operative criterion is the open horizon: at least 130 degrees
  # of each village's horizon, within 4 km, free of turbines.  And the 2024
  # framework, which replaced the 2013 one on 25 April 2024, does not carry the
  # inter-distance at all.
  #
  # The open-horizon test is therefore implemented directly, and the 4-6 km
  # inter-distance is kept only as a labelled legacy sensitivity.
  # ------------------------------------------------------------------
  landscape:
    min_free_azimuth_deg: 130
    horizon_radius_m: 4000

