# NIC5 cluster overrides (merged by `nic5.sh solve` via --configfile).
# Local config/config.walloon.yaml is unchanged.
#
# Solve jobs run on the `hmem` partition (see cluster/config.sh). Observed 1h
# peak is ~32–37 GB; requesting the full ~1 TB node forces a long Resources
# wait on a 3-node partition. 100 GB still leaves headroom and can share a
# mixed hmem node. The 2026-09-02 6h item-2 solve ran on `batch` at ~8 GB.
#
# Keep solving.cpus / gurobi-default.threads in sync with each other and with
# the Slurm cpus-per-task set in `nic5.sh solve`.
#
# EDIT (2026-09-12): 100 GB -> 80 GB, and the target partition moved to `batch`
# (cluster/config.sh). Measured peak RSS on the 2026-09-07 1h production run
# was 22.4 / 28.2 / 29.8 / 29.9 GB across the four horizons, so 80 GB is ~2.7x
# the worst observed while letting three solves share one 252 GB `batch` node
# — which is what makes a 13-scenario batch run in one night instead of five.
solving:
  mem_mb: 80000
  cpus: &cluster_cpus 16
  solver_options:
    gurobi-default:
      threads: *cluster_cpus
      # 2030 barrier abort 2026-08-30: "Numerical trouble encountered /
      # Model may be infeasible or unbounded. Consider BarHomogeneous".
      BarHomogeneous: 1
