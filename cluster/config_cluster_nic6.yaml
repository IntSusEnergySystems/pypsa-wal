# SPDX-License-Identifier: MIT
# NIC6 cluster overrides (merged last by `REMOTE=nic6 nic5.sh solve`; selected
# by CLUSTER_CONFIG in cluster/config.sh). Added 2026-10-10 for the batch split
# between NIC5 and NIC6.
#
# NIC6 enforces 1 900 MB per allocated core at submit, so the 80 GB / 16 cores
# of cluster/config_cluster.yaml (5 000 MB per core) would be rejected. The 1 h
# solve peaks at ~34 GB (NIC5, 4 Oct batch): 32 cores x 1 875 MB = 60 GB covers
# it with margin, and Gurobi gets the 32 threads (it would take 32 regardless of
# the allocation; ~/llm/env-nic6-ceci.md). (Superseded below: cpus 40, threads 32.)
# 12 Oct 2026: the 10 Oct batch peaked at 48.6-58.0 GiB (83-99 %) of the 58.6 GiB
# request with 32 threads. Memory is bought with cores (1 900 MB per core, checked
# at submit): 40 cores x 1 900 = 76 000 MB covers 75 000 MB (`sbatch --test-only`
# accepts it), while Gurobi keeps 32 threads. The solve script does not read
# `snakemake.threads`, so `cpus` (Slurm allocation) and `threads` (Gurobi) differ.
solving:
  mem_mb: 75000
  cpus: 40
  solver_options:
    gurobi-default:
      threads: 32
      BarHomogeneous: 1
