# Local 6 h validation layer for the central case. Use *after*
# config.walloon.yaml so it wins:
#
#   snakemake --configfile config/config.walloon.yaml config/config.test6h_central.yaml \
#             --cores 12 --resources mem_mb=100000 -call
#
# Only two keys, and both have to live here rather than in the scenario overlay:
#   * `run.name` selects which overlay in scenarios.walloon.yaml is active, and
#     therefore RDIR — `scen_central_6h`, so the 1 h cabinet-batch results in
#     results/walloon/scen_central are not overwritten;
#   * `html_publish.enable` is read from the static parse-time config by
#     rules/publish_html.smk, so a scenario override cannot reach it — that is
#     how the 2026-09-03 smoke test published itself to the public site by
#     accident.
#
# The 6 h time step itself is in the `scen_central_6h` scenario overlay.
run:
  name:
  - scen_central_6h
html_publish:
  enable: false
