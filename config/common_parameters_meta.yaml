# Sidecar for config/input_parameters_for_models.csv (common_parameters.md §5.3).
# Project monetary reference year and the technology-data archive pin used by
# scripts/refresh_common_parameters_currency.py (§4.3) and
# scripts/build_common_parameters.py (§5.4).

EUR_REF: 2025

technology_data:
  tag: v0.14.0
  eur_year: 2025
  # Relative to repository root
  archive_dir: data/costs/archive/v0.14.0

# Eurostat HICP factors used to inflate non-PyPSA rows that were still on an
# older purchasing-power year (§8.8–8.9). Same method as technology-data v0.14.0.
hicp_inflation:
  source: >-
    Eurostat HICP annual average rate of change, EEA row
    (technology-data v0.14.0 inputs/prc_hicp_aind__custom_20097956_spreadsheet.xlsx)
  method: technology-data scripts/_helpers.py prepare_inflation_rate / adjust_for_inflation
  EUR_REF: 2025
  factor_2020_to_2025: 1.257335
  factor_2023_to_2025: 1.051650
  # Added 2026-09-12 for ICEDD's coal/gas/oil and uranium rows, which arrived
  # tagged at their source vintage (4a4116aa, 03352c45) rather than EUR_REF.
  # 2021 is the product of the rates below (2022..2025), the same method that
  # reproduces the two factors above exactly.
  factor_2021_to_2025: 1.221900
  # 2011 predates `rates_eea_percent`; the value is the one already established
  # in docs/nuclear-alignment-20260816.md S7 for the uranium shortlist price
  # (3.4122 EUR2011 = 4.6497 EUR2025/MWh_th).
  factor_2011_to_2025: 1.362669
  rates_eea_percent:
    2021: 2.9
    2022: 9.2
    2023: 6.4
    2024: 2.6
    2025: 2.5
