# Ambitious EV flexibility. Same TIMES vd and nuclear trajectory as
# `scen_demande_haute` — the only delta is the pair of EV charging-weight keys,
# so a diff against it is a clean EV-flexibility sensitivity. `test_ev_charging.py`
# pins the vd/agg-caps pairing, so this block cannot drift off the study run.
#
# Elia AdeqFlex 2025 "Current commitments - High Flex" (Elia's most ambitious
# flexibility case) through 2035, then **extrapolated** to 2040/2045/2050 instead
# of holding 2036 as the base case does. Reproduce with:
#
#   python scripts/walloon_scripts/build_ev_charging_weights.py \
#       --scenario "Current commitments - High Flex" --extrapolate
#
# The extrapolation continues two adoption fractions as saturating logistics
# anchored on Elia's 2036 value, with the log-odds slope read from Elia's own
# 2030-2036 window: the steerable share `1 - V0` against a `1 - public` = 0.85
# ceiling (Elia assumes no flexibility from public charging, so that share is
# unmanaged by construction), and the market share *of* steerable charging
# against a stated 0.70 ceiling. Absolute fleet shares that produces —
# natural / local / market: 0.153 / 0.492 / 0.355 (2040) -> 0.150 / 0.357 / 0.493
# (2050). The location split is held at 2036, not extrapolated: its driver (the
# company-car -> private-ownership shift) has run its course by then.
# Do not hand-edit either key. docs/ev-charging-softlink.md §4.6.
scen_evflex:
  sector:
    times_file: data/walloon/scen_central_demande_haute_v01_260907_0709.vd
    rooftop_floor:
      # Item 8 on with the base-year fleet split; same as scen_demande_haute.
      enable: true
      node: BEWAL
      file: data/walloon/times_pv_rooftop_share.csv
    industry_cc_floor:
      enable: true
      node: BEWAL
      file: data/walloon/times_industrial_capture.csv
    bev_dsm_availability:
      2020: 0.005
      2025: 0.03
      2030: 0.131
      2035: 0.27
      2040: 0.355
      2045: 0.433
      2050: 0.493
    # `natural` is renormalised over natural+local, so it *rises* after 2040
    # (0.237 -> 0.296) while the absolute natural share still falls (0.153 ->
    # 0.150): the market slice taken off the top grows faster than natural
    # shrinks, so natural gains share of the shrinking remainder. Not a typo.
    local_bev_dsm:
      2020:
        natural: 0.7388
        sunny_PV: 0.0429
        sunny_noPV: 0.0429
        cloudy_PV: 0.0429
        cloudy_noPV: 0.0429
        work: 0.0896
      2025:
        natural: 0.6908
        sunny_PV: 0.0508
        sunny_noPV: 0.0508
        cloudy_PV: 0.0508
        cloudy_noPV: 0.0508
        work: 0.106
      2030:
        natural: 0.4652
        sunny_PV: 0.0983
        sunny_noPV: 0.0983
        cloudy_PV: 0.0983
        cloudy_noPV: 0.0983
        work: 0.1416
      2035:
        natural: 0.2601
        sunny_PV: 0.1496
        sunny_noPV: 0.1496
        cloudy_PV: 0.1496
        cloudy_noPV: 0.1496
        work: 0.1415
      2040:
        natural: 0.237
        sunny_PV: 0.1571
        sunny_noPV: 0.1571
        cloudy_PV: 0.1571
        cloudy_noPV: 0.1571
        work: 0.1346
      2045:
        natural: 0.2651
        sunny_PV: 0.1513
        sunny_noPV: 0.1513
        cloudy_PV: 0.1513
        cloudy_noPV: 0.1513
        work: 0.1297
      2050:
        natural: 0.2957
        sunny_PV: 0.145
        sunny_noPV: 0.145
        cloudy_PV: 0.145
        cloudy_noPV: 0.145
        work: 0.1243
  electricity:
    retrofit_nuclear_once: false
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_demande_haute.csv
  self_sufficiency:
    # Item 6a ON, same values and same reasoning as scen_demande_haute above —
    # keep the two in step so a diff stays a clean EV-flexibility sensitivity.
    self_sufficiency_constraint: true
    mode: absolute
    nodes:
    - BEWAL
    limit_twh:
      2030: 2.94
      2040: 6.47
      2050: 10.0


# ===========================================================================
# SEPTEMBER 2026 CABINET BATCH — ICEDD export times_20260911_*
#
# Delivered 2026-09-12 to s3://intervectoriel/test/scenarios/times_20260911_*.
# Full definitions, provenance and the parallel run recipe:
#   docs/runs-20260912-cabinet-batch.md
#
# Three things make these blocks longer than they look:
#
# 1. `rooftop_floor` and `industry_cc_floor` are TIMES *outputs* fed back into
#    PyPSA, so they are per-scenario, not shared. They are extracted from each
#    .vd by scripts/walloon_scripts/extract_times_softlink_values.py — never by
#    hand. They differ materially between scenarios (2040 rooftop capacity:
#    10.47 GW central vs 9.68 GW taxshift), so reusing the central files would
#    turn every sensitivity into a hybrid. The `rooftop_gw` column of those
#    CSVs is the floor; the `share` column is the superseded pin and is kept
#    only as provenance.
#
# 2. `self_sufficiency.limit_twh` is identical (2.94 / 6.47 / 10.0) in all eight
#    .vd files — TIMES `Transfo_Imp` is a binding bound there, not a free
#    output — so the same block is repeated deliberately rather than copied
#    carelessly. test_cabinet_batch.py pins that.
#
# 3. Numeric assumptions live in config/scenarios/<name>.csv (override rows over
#    config/input_parameters_for_models.csv) and are materialised by
#    `build_common_parameters.py --write --all-scenarios`. A scenario with no
#    override file points at the central data files; a scenario with one points
#    at its own generated copies. Never hand-edit the generated copies.
# ===========================================================================

scen_central:
  sector:
    times_file: data/walloon/scen_central_v01_260911_1109.vd
    rooftop_floor:
      enable: true
      node: BEWAL
      file: data/walloon/times_pv_rooftop_share_scen_central.csv
    industry_cc_floor:
      enable: true
      node: BEWAL
      file: data/walloon/times_industrial_capture_scen_central.csv
  electricity:
    retrofit_nuclear_once: false
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_demande_haute.csv
  self_sufficiency:
    self_sufficiency_constraint: true
    mode: absolute
    nodes:
    - BEWAL
    limit_twh:
      2030: 2.94
      2040: 6.47
      2050: 10.0

