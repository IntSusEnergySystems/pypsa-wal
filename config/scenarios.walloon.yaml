# Scenario overrides for config/config.walloon.yaml (run.scenarios.enable: true).
#
# Costs and potentials come from the single pair of files patched by
# scripts/build_common_parameters.py:
#   data/walloon/custom_costs.csv
#   data/walloon/custom_potentials.csv
# so a scenario only lists what it *changes*. Do not copy a cost file to vary
# one number — use `costs: overwrites:` (see scen_nuc* below).
#
# PROPOSED CHANGE (not implemented, 2026-08-27): scenario values move into
# per-scenario override files, config/scenarios/<scen>.csv, layered over
# config/input_parameters_for_models.csv by build_common_parameters.py, leaving
# this file as a pure registry (name + .vd + override path). Note that
# `costs: overwrites:` used by scen_nuc* below is deprecated upstream
# (scripts/process_cost_data.py warns when it applies it), so do not extend it.
# Rationale, semantics and effort: docs/scenario-handling-proposal.md
#
# Hurdle-rate (financial discount rate) variants use `costs.hurdle_rate_fn`
# pointing at data/walloon/discount_rates_<variant>.csv generated by
# scripts/build_common_parameters.py from hurdle:<variant>:<sector> rows in
# config/input_parameters_for_models.csv (base file: discount_rates.csv).

scen_base:
  sector:
    times_file: data/walloon/scen_base_251129_0112.vd
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_base.csv

scen_corrige:
  sector:
    times_file: data/walloon/scen_corrige_251129_0112.vd
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_corrige.csv

# Demande haute (Aug 2026 TIMES re-run, nuclear-aligned with Elia/cabinet central
# path). Source: s3://intervectoriel/test/scenarios/times_20260828/
# (previous: times_20260727 / scen_demande_haute_v01_260727_fix_nuc_2807.vd).
# Nuclear in TIMES: Tihange retrofit repeatable to keep 1 GW through 2050;
# 2045 imposes 0.25 GW SMR + 0.5 GW large-scale; 2050 imposes 1 GW SMR + 1 GW
# large-scale. PyPSA agg caps reproduce that trajectory exactly (MW_e, caps on
# total incl. existing): 2035/2040 = Tihange 3 LTO 1.03 GW in BEWAL + Doel 4
# LTO 1.0 GW in Flanders, no new build; 2045 = 1.75 GW all in BEWAL (Doel 4
# retired); 2050 = 3.0 GW all in BEWAL. Details and vd extraction:
# docs/nuclear-alignment-20260816.md. `retrofit_nuclear_once: false` allows the
# 2040->2050 Tihange retrofit repeat, mirroring the vd.
scen_demande_haute:
  sector:
    times_file: data/walloon/scen_central_demande_haute_v1_260828_2808.vd
    rooftop_share:
      # Item 8 withdrawn for this 1h run (2026-09-03). 2025 at 25.8 % was
      # optimal after rooftop left solar-all. 2030 at 71.4 % is still
      # inf-or-unbounded in 0 barrier iterations with item 6a off (job
      # 11110016). TIMES mix is 5.2 GW rooftop / 2.1 GW utility; Elia
      # solar-all floor is 6.5 GW utility. Code and CSV stay; overlay off.
      # See docs/logs/2026-09-02_scen_demande_haute_2010_1h.md §9.
      enable: false
      node: BEWAL
      file: data/walloon/times_pv_rooftop_share.csv
    industry_cc_floor:
      # Item 9 withdrawn for this 1h run (2026-09-03 evening). 2040 floor
      # 5 077 kt (2050: 4 826) exceeds the maximum BEWAL can capture from the
      # transferred industrial fuel mix: 2040 = 357 kt process x0.95
      # + 7.62 TWh biomass x0.348 + 5.56 TWh gas x0.188 = 3 361 kt (2050:
      # 3 424 kt) with every CC link at full demand. Barrier proved
      # infeasible (79 it, job 11114388). STORAGEMININD implies capture
      # sources (feedstock, SMR/CCGT-CC) PyPSA does not carry. Code and CSV
      # stay; overlay off. See docs/logs/2026-09-02_scen_demande_haute_2010_1h.md §9.
      enable: false
      node: BEWAL
      file: data/walloon/times_industrial_capture.csv
  electricity:
    retrofit_nuclear_once: false
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_demande_haute.csv
  self_sufficiency:
    # Item 6a withdrawn for this 1h run (2026-09-03). TIMES Transfo_Imp
    # 2.94 / 6.47 / 10 TWh is not feasible as a GROSS hourly cap on BEWAL
    # (incl. Flanders): 2025 1h already has 13.1 TWh gross inflow (8.2 TWh
    # from abroad alone) while annual NET is an export (−1.5 TWh). 2030
    # job 11108009 was inf-or-unbounded in 0 barrier iterations. Code and
    # tests stay; only this overlay is off. See
    # docs/logs/2026-09-02_scen_demande_haute_2010_1h.md §9.
    self_sufficiency_constraint: false
    mode: absolute
    nodes:
    - BEWAL
    limit_twh:
      2030: 2.94
      2040: 6.47
      2050: 10.0

# Nuclear CAPEX sensitivities. `costs: overwrites: {<parameter>: {<technology>: value}}`
# is applied in scripts/process_cost_data.py on top of the custom-costs file, before
# the annuity is computed, so capital_cost follows. Units are EUR/MW_e (the cost table
# has already been converted from /kW at that point), and must be written as a plain
# number: PyYAML follows YAML 1.1, where `11.5e6` is a *string* (the exponent needs a sign).
# Baseline for reference: 9500 EUR/kW_e in data/walloon/custom_costs.csv.
scen_nuc11500:
  sector:
    times_file: data/walloon/scen_corrige_nuc11500_251205_0512.vd
  costs:
    overwrites:
      investment:
        nuclear: 11500000   # = 11500 EUR/kW_e
  solving:
    agg_p_nom_limits:
      file: data/agg_p_nom_minmax.csv

scen_nuc13500:
  sector:
    times_file: data/walloon/scen_corrige_nuc13500_251205_0512.vd
  costs:
    overwrites:
      investment:
        nuclear: 13500000   # = 13500 EUR/kW_e
  solving:
    agg_p_nom_limits:
      file: data/agg_p_nom_minmax.csv

scen_imppel:
  sector:
    times_file: data/walloon/scen_corrige_imppel_251130_0412.vd
  electricity:
    walloon_potentials: data/walloon/custom_potentials_imppel.csv
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_corrige.csv

scen_data:
  sector:
    times_file: data/walloon/scen_corrige_data_251130_0412.vd
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_corrige.csv

# Ambitious EV flexibility. Same TIMES vd and nuclear trajectory as
# `scen_demande_haute` — the only delta is the pair of EV charging-weight keys,
# so a diff against it is a clean EV-flexibility sensitivity. `test_ev_charging.py`
# pins the vd/agg-caps pairing, so this block cannot drift off the study run.
#
# Elia AdeqFlex 2025 "Current commitments - High Flex" (Elia's most ambitious
# flexibility case) through 2035, then **extrapolated** to 2040/2045/2050 instead
# of holding 2036 as the base case does. Reproduce with:
#
#   python scripts/walloon_scripts/build_ev_charging_weights.py \
#       --scenario "Current commitments - High Flex" --extrapolate
#
# The extrapolation continues two adoption fractions as saturating logistics
# anchored on Elia's 2036 value, with the log-odds slope read from Elia's own
# 2030-2036 window: the steerable share `1 - V0` against a `1 - public` = 0.85
# ceiling (Elia assumes no flexibility from public charging, so that share is
# unmanaged by construction), and the market share *of* steerable charging
# against a stated 0.70 ceiling. Absolute fleet shares that produces —
# natural / local / market: 0.153 / 0.492 / 0.355 (2040) -> 0.150 / 0.357 / 0.493
# (2050). The location split is held at 2036, not extrapolated: its driver (the
# company-car -> private-ownership shift) has run its course by then.
# Do not hand-edit either key. docs/ev-charging-softlink.md §4.6.
scen_evflex:
  sector:
    times_file: data/walloon/scen_central_demande_haute_v1_260828_2808.vd
    rooftop_share:
      # Same item-8 withdrawal as scen_demande_haute (2030 71.4 % inf).
      enable: false
      node: BEWAL
      file: data/walloon/times_pv_rooftop_share.csv
    industry_cc_floor:
      # Same item-9 withdrawal as scen_demande_haute (2040/2050 floors exceed
      # the capturable maximum from the transferred fuel mix).
      enable: false
      node: BEWAL
      file: data/walloon/times_industrial_capture.csv
    bev_dsm_availability:
      2020: 0.005
      2025: 0.03
      2030: 0.131
      2035: 0.27
      2040: 0.355
      2045: 0.433
      2050: 0.493
    # `natural` is renormalised over natural+local, so it *rises* after 2040
    # (0.237 -> 0.296) while the absolute natural share still falls (0.153 ->
    # 0.150): the market slice taken off the top grows faster than natural
    # shrinks, so natural gains share of the shrinking remainder. Not a typo.
    local_bev_dsm:
      2020:
        natural: 0.7388
        sunny_PV: 0.0429
        sunny_noPV: 0.0429
        cloudy_PV: 0.0429
        cloudy_noPV: 0.0429
        work: 0.0896
      2025:
        natural: 0.6908
        sunny_PV: 0.0508
        sunny_noPV: 0.0508
        cloudy_PV: 0.0508
        cloudy_noPV: 0.0508
        work: 0.106
      2030:
        natural: 0.4652
        sunny_PV: 0.0983
        sunny_noPV: 0.0983
        cloudy_PV: 0.0983
        cloudy_noPV: 0.0983
        work: 0.1416
      2035:
        natural: 0.2601
        sunny_PV: 0.1496
        sunny_noPV: 0.1496
        cloudy_PV: 0.1496
        cloudy_noPV: 0.1496
        work: 0.1415
      2040:
        natural: 0.237
        sunny_PV: 0.1571
        sunny_noPV: 0.1571
        cloudy_PV: 0.1571
        cloudy_noPV: 0.1571
        work: 0.1346
      2045:
        natural: 0.2651
        sunny_PV: 0.1513
        sunny_noPV: 0.1513
        cloudy_PV: 0.1513
        cloudy_noPV: 0.1513
        work: 0.1297
      2050:
        natural: 0.2957
        sunny_PV: 0.145
        sunny_noPV: 0.145
        cloudy_PV: 0.145
        cloudy_noPV: 0.145
        work: 0.1243
  electricity:
    retrofit_nuclear_once: false
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_demande_haute.csv
  self_sufficiency:
    # Same 6a withdrawal as scen_demande_haute: 1h GROSS BEWAL cap is inf.
    # See docs/logs/2026-09-02_scen_demande_haute_2010_1h.md §9.
    self_sufficiency_constraint: false
    mode: absolute
    nodes:
    - BEWAL
    limit_twh:
      2030: 2.94
      2040: 6.47
      2050: 10.0
