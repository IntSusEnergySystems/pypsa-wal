# Nuclear CAPEX sensitivities. `costs: overwrites: {<parameter>: {<technology>: value}}`
# is applied in scripts/process_cost_data.py on top of the custom-costs file, before
# the annuity is computed, so capital_cost follows. Units are EUR/MW_e (the cost table
# has already been converted from /kW at that point), and must be written as a plain
# number: PyYAML follows YAML 1.1, where `11.5e6` is a *string* (the exponent needs a sign).
# Baseline for reference: 9500 EUR/kW_e in data/walloon/custom_costs.csv.
scen_nuc11500:
  sector:
    times_file: data/walloon/scen_corrige_nuc11500_251205_0512.vd
  costs:
    overwrites:
      investment:
        nuclear: 11500000   # = 11500 EUR/kW_e
  solving:
    agg_p_nom_limits:
      file: data/agg_p_nom_minmax.csv

scen_nuc13500:
  sector:
    times_file: data/walloon/scen_corrige_nuc13500_251205_0512.vd
  costs:
    overwrites:
      investment:
        nuclear: 13500000   # = 13500 EUR/kW_e
  solving:
    agg_p_nom_limits:
      file: data/agg_p_nom_minmax.csv

scen_imppel:
  sector:
    times_file: data/walloon/scen_corrige_imppel_251130_0412.vd
  electricity:
    walloon_potentials: data/walloon/custom_potentials_imppel.csv
  solving:
    agg_p_nom_limits:
      file: data/walloon/agg_p_nom_minmax_corrige.csv

scen_data:
