  # true and the national caps carry the same series (F5, 2026-09-05), so every
  # country would still face 0.45 at 2030. Both have to move. Only the three
  # Belgian regions are freed — DE/FR/GB/NL/LU keep their own 0.45 national cap,
  # so the neighbours are unchanged and this stays a Belgian policy sensitivity
  # rather than a European one.
  #
  # 1.0 = 1990 emissions, i.e. no reduction required. 2025 already realises
  # 0.648, so the cap cannot bind. 2040 and 2050 are untouched.
  co2_budget:
    2025: 0.648
    2030: 1.0
    2040: 0.250
    2050: 0.050
  budget_national:
    2030:
      BEBRU: 1.0
      BEVLG: 1.0
      BEWAL: 1.0
      DE: 0.45
      FR: 0.45
      GB: 0.45
      NL: 0.45
      LU: 0.45
  self_sufficiency:
