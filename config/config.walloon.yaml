# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#run
run:
  # Single-run layout: RDIR is "walloon-model/", no {run} wildcard — the cluster
  # scripts and instructions.md assume it. Multi-scenario runs: config.times-pypsa.yaml
  name: "walloon-model"
  wallon_node: BEWAL
  flemish_node: BEVLG
  scenarios:
    enable: false
    file: config/scenarios.walloon.yaml

# coupling_dir: /path/to/coupling_run   # optional; enables pre-exported TIMES inputs

# WEATHER YEAR — the only place to change it. Keep the three years in step:
# snapshots.start / snapshots.end pick the hours, default_cutout supplies the
# weather for them, and a mismatch silently pairs one year's demand with
# another year's wind and sun. Switching to a year whose cutout is not in
# data/cutout/archive/<version>/ triggers a multi-GB download (~6.6 GB) of
# europe-<year>-sarah3-era5.nc.
# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#snapshots
snapshots:
  start: "2010-01-01"
  end: "2011-01-01"
  inclusive: left

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#atlite
atlite:
  default_cutout: "europe-2010-sarah3-era5"
  nprocesses: 4

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#foresight
foresight: myopic

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#scenario
# Wildcard docs in https://pypsa-eur.readthedocs.io/en/latest/wildcards.html
scenario:
  clusters:
  - adm
  sector_opts:
  - ''
  planning_horizons:
  - 2025
  - 2030
  - 2040
  - 2050

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#countries
# Walloon model: Belgium and electrical neighbors
countries:
- BE
- FR
- GB
- NL
- DE
- LU

electricity:
  custom_powerplants: True
  walloon_reassignment: True
  walloon_potentials: data/walloon/custom_potentials.csv
  retrofit_nuclear_once: true

  extendable_carriers:
    extendable_nuclear_links:
      2025: [FR, GB, NL, LU]
      2030: [FR, GB, NL, LU]
      2040: [BEWAL, BEBRU, BEVLG, FR, GB, NL, LU]
      2050: [BEWAL, BEBRU, BEVLG, FR, GB, NL, LU]

  powerplants_filter: ((DateOut >= 2024) or (DateOut != DateOut)) and Country != 'BE'

  transmission_limit: v1.0
  transmission_limit_myopic:
    2030: v1.0
    2040: v1.0
    2050: v1.0
  apply_ntc_constraints: True

# docs
# TODO: PyPSA-Eur merge issue in prepare_sector_network.py
# regulate what components with which carriers are kept from PyPSA-Eur;
# some technologies are removed because they are implemented differently
# (e.g. battery or H2 storage) or have different year-dependent costs
# in PyPSA-Eur-Sec
pypsa_eur:
  Generator:
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - solar-hsat
  - solar
  - ror

existing_capacities:
  grouping_years_power: [1920, 1950, 1955, 1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030, 2035, 2040, 2050]
  threshold_capacity: 0
  # Age distribution of the inherited heat-pump stock, overriding the linear
  # 1980-2019 spread that PyPSA-Eur assumes for every heating technology.
  # `decentral air-sourced heat pump` has an 18-year technology-data lifetime
  # against a 20-year default_heating_lifetime, so the linear spread puts 5/14 =
  # 36 % of the fleet in a 2010 bin that dies in 2028 -- between the 2025 and
  # 2030 horizons. Derived from the TIMES stock trajectory itself: Walloon air-HP
  # capacity goes 231.6 MW_th (2021) -> 929.4 MW_th (2025), so 75 % of the base-
  # year fleet was installed in 2022-2025, i.e. after every available grouping
  # year. That tranche goes to the newest live bin; the 2021 stock keeps the
  # linear spread. docs/heat-softlink.md S5.
  # Applies to every node, not only BEWAL -- European heat-pump sales grew by an
  # order of magnitude over the same period, so it is closer to the truth
  # everywhere than the linear default.
  heat_stock_age_profile:
    air-sourced heat pump:
      2010: 0.089
      2015: 0.089
      2019: 0.822

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#clustering
clustering:
  mode: custom_busmap_BE
  temporal:
    resolution_elec: False
    # 6 h here on purpose: this config is the light legacy reference. The 1 h
    # coupled study is config.times-pypsa.yaml. `feat/bev-myopic` set 1 h here as
    # well; reverted, because a 1 h four-horizon myopic chain is a different
    # machine's worth of solve time.
    resolution_sector: 6h
  exclude_carriers:
    - nuclear

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#sector
sector:
  # Elia AdeqFlex 2025 "Current commitments", derived by
  # scripts/walloon_scripts/build_ev_charging_weights.py -- do not hand-edit.
  # bev_dsm_availability is the MARKET share (V1M+V2M) of the fleet;
  # local_bev_dsm splits what is left between natural (V0) and the local curves
  # (V1H+V2H), renormalised over those two. Both must come from the SAME Elia
  # (scenario, year) cell or they describe no real case: mixing them is what put
  # the 2050 natural share 69 % above the scenario its market share came from.
  # Horizons past 2036 hold that year rather than extrapolating a behavioural
  # adoption curve. For a flexibility-rich case, regenerate with
  # --scenario "Current commitments - High Flex" (market 0.28 / natural 0.236 at
  # 2040+), do not hand-tune a middle. docs/ev-charging-softlink.md S3b.
  bev_dsm_availability:
    2020: 0.005
    2025: 0.01
    2030: 0.07
    2035: 0.172
    2040: 0.18
    2045: 0.18
    2050: 0.18
  # bev_dsm_restriction_value based on:
  # Blonsky, M., Munankarmi, P., Balamurugan, S. (2021). Incorporating Residential Smart
  # Electric Vehicle Charging in Home Energy Management Systems: Preprint. NREL/CP-5D00-78540.
  # https://www.nrel.gov/docs/fy21osti/78540.pdf
  bev_dsm_restriction_value: 0.7
  bev_dsm_restriction_time: 7
  # Elia's 2026 vintage applies to horizons 2025 & 2030; 2036 vintage to 2035, 2040 and beyond.
  bev_avail_max:
    2020: 0.4
    2025: 0.4
    2030: 0.4
    2035: 0.48
    2040: 0.48
    2045: 0.48
    2050: 0.48
  bev_avail_mean:
    2020: 0.32
    2025: 0.32
    2030: 0.32
    2035: 0.35
    2040: 0.35
    2045: 0.35
    2050: 0.35
  bev_avail_min:
    2020: 0.2
    2025: 0.2
    2030: 0.2
    2035: 0.18
    2040: 0.18
    2045: 0.18
    2050: 0.18
  bev_energy: 0.06 # Elia assumes 60 kWh
  bev_charge_rate: 0.011 # aligned with Elia
  bev_natural_charging_split: true
  bev_natural_charging_profile_fn: data/walloon/elia_natural_charging_daily_profile_utc0.csv
  local_bev_dsm:
    2020:
      natural: 0.7388
      sunny_PV: 0.0429
      sunny_noPV: 0.0429
      cloudy_PV: 0.0429
      cloudy_noPV: 0.0429
      work: 0.0896
    2025:
      natural: 0.6969
      sunny_PV: 0.0498
      sunny_noPV: 0.0498
      cloudy_PV: 0.0498
      cloudy_noPV: 0.0498
      work: 0.1039
    2030:
      natural: 0.5054
      sunny_PV: 0.0909
      sunny_noPV: 0.0909
      cloudy_PV: 0.0909
      cloudy_noPV: 0.0909
      work: 0.131
    2035:
      natural: 0.3416
      sunny_PV: 0.1331
      sunny_noPV: 0.1331
      cloudy_PV: 0.1331
      cloudy_noPV: 0.1331
      work: 0.126
    2040:
      natural: 0.3292
      sunny_PV: 0.1381
      sunny_noPV: 0.1381
      cloudy_PV: 0.1381
      cloudy_noPV: 0.1381
      work: 0.1184
    2045:
      natural: 0.3292
      sunny_PV: 0.1381
      sunny_noPV: 0.1381
      cloudy_PV: 0.1381
      cloudy_noPV: 0.1381
      work: 0.1184
    2050:
      natural: 0.3292
      sunny_PV: 0.1381
      sunny_noPV: 0.1381
      cloudy_PV: 0.1381
      cloudy_noPV: 0.1381
      work: 0.1184
  v2g: false # turn off v2g
  land_transport_electric_share:
    2020: 0
    2025: 0.15
    2030: 0.35
    2040: 0.81
    2050: 1
  land_transport_ice_share:
    2020: 1
    2025: 0.85
    2030: 0.65
    2040: 0.19
    2050: 0

  times_demand: true
  times_file: data/walloon/scen_base_coherence_3110.vd
  # times_mappings_dir: optional override; defaults to TIMES_PyPSA data/ via times_pypsa.default_mappings_dir()
  # times_use_preexported: true  # if coupling_dir set, copy pypsa_inputs instead of re-parsing .vd
  # TIMES heating soft-link. Every switch defaults to the pre-2026-08 behaviour,
  # so removing this block reproduces the old results. Two ALTERNATIVE mix
  # mechanisms — `energy_mix` (option C, annual constraint) and `profile`
  # (option B', pinned hourly profile). Enabling both raises. docs/heat-softlink.md
  #
  # This config stays on the LEGACY path deliberately: the soft-link is enabled in
  # config.times-pypsa.yaml, and keeping one config on each side is what makes the
  # before/after comparison of docs/heat-softlink.md §4 reproducible from one
  # checkout. `feat/bev-myopic` flipped these three switches on (probably fallout
  # from its merge of master); reverted here. Flip them if you want this config
  # coupled too — but then the legacy reference is gone.
  times_heat:
    node: BEWAL
    # times | times_base_year | pypsa — how the TIMES residential decentral heat
    # is divided between the rural and urban decentral buses. `times` (the old
    # behaviour) lets the TIMES archetype labelling drift the rural share from
    # 59 % (2025) to 37 % (2050), i.e. dwellings move between PyPSA buses.
    urban_rural_split: times
    # Replace the BEWAL row of existing_heating_distribution (EU 2012 dataset,
    # population-scaled) with the TIMES base-year stock. Both are in MW_th.
    base_year_capacities: false
    # --- option B' — reconstructed hourly profiles ---
    # The TIMES technology shares combined with PyPSA's own heat-load shape give
    # one heat profile per group and bus; the dispatch is pinned to it. The mix
    # is then exactly TIMES's at every hour, with no tolerance, no senses and no
    # zero-target special case. Solar thermal follows its own collector
    # availability instead of the load, because it is the only group with a
    # dispatch ceiling. Mutually exclusive with `energy_mix`. docs/heat-softlink.md
    profile:
      enable: false
      # The group left unpinned, so the heat-bus balance determines it. The heat
      # pump is the only group with no fuel or CO2 limit upstream, so it can
      # always take the residual — and any relaxation shows up as visible extra
      # electrification rather than as an infeasibility.
      absorber: heat pump
      # EUR/MWh_th of TIMES profile not delivered, one scalar per group. The
      # Walloon CO2 cap and the EU solid-biomass limit both already bind in 2040
      # before any heat constraint exists, so this is what keeps that horizon
      # from failing. 0 = hard constraints (and no relaxation variables at all).
      penalty: 1000.0
      # Groups not pinned at all: they pool with the absorber and split their
      # combined residual freely. The escape hatch if 2040 relaxes too far.
      free_groups: []
      export: true
    # --- option C — annual energy-mix constraints. docs/heat-softlink.md ---
    energy_mix:
      enable: false
      # share | absolute. `share` constrains each technology group against the
      # realised decentral heat supply, so the ~4 % of the load that is cooking
      # fuel / tertiary other-energy / agriculture heat cannot distort the mix,
      # and the constraint set cannot over-determine the LP.
      mode: share
      tolerance: 0.05
      slack_groups: []
      # forbid | free — a technology TIMES has fully retired (oil boilers in
      # 2050) is forbidden rather than left free, which is where the mix
      # constraint would otherwise leak worst.
      zero_target: forbid
      # EUR/MWh_th of unmet TIMES mix. A finite penalty makes the constraints
      # SOFT, so a mix Wallonia physically cannot deliver (2040: the gas floor
      # against a binding CO2 cap) relaxes at a price instead of making the LP
      # infeasible and hanging the myopic chain. 0 = hard constraints.
      penalty: 1000.0
  # RSD-RENO / COM-RENO in the TIMES ~TFM_INS table (0.12 / 0.11). PyPSA holds
  # a single scalar, so the residential rate wins — Wallonia's renovation is
  # overwhelmingly residential. Inert while `retro_endogen` is false (the
  # config.default.yaml value), but it must be right the day it is switched on.
  # docs/discount-rates.md D6.
  retrofitting:
    interest_rate: 0.12
  oil_boilers: true
  solid_biomass_import:
    enable: true
  regional_coal_demand: true
  methanol:
    regional_methanol_demand: true
  co2_sequestration_potential:
    2020: 0
    2025: 0
    2030: 20   # 40 * 0.5
    2035: 50  # 100 * 0.5
    2040: 90  # 180 * 0.5
    2045: 125  # 250 * 0.5
    2050: 125  # 250 * 0.5
  agriculture_machinery_electric_share: 0.5
  agriculture_machinery_oil_share: 0.5
  shipping_methanol_share:
    2020: 0
    2025: 0
    2030: 0.16
    2035: 0.32
    2040: 0.48
    2045: 0.64
    2050: 0.80
  shipping_oil_share:
    2020: 1
    2025: 1
    2030: 0.84
    2035: 0.68
    2040: 0.52
    2045: 0.36
    2050: 0.20
  district_heating:
    potential: 0.3
  electrobiofuels: false

