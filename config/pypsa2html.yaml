# PyPSA-Wal HTML report config (consumed by rules/pypsa2html.smk and the
# pypsa2html CLI). Paths are relative to this file's parent (the repo root)
# via `root: ..`.
#
#     pypsa2html build --config config/pypsa2html.yaml
root: ..

project:
  name: PyPSA-Wal
  subtitle: Walloon energy system scenarios
  decimals: 3

model:
  clusters: adm
  opts: ""
  sector_opts: ""
  planning_horizons: null      # discovered from the solved networks

nodes:
  detect: true
  focus: BEWAL
  labels:
    BEWAL: Wallonia
    BEVLG: Flanders
    BEBRU: Brussels
    DE: Germany
    FR: France
    GB: Great Britain
    LU: Luxembourg
    NL: Netherlands
  aggregate:
    enabled: true
    code: ALL
    label: All regions
  groups:
    - {code: BE, label: Belgium, members: [BEVLG, BEWAL, BEBRU]}

scenarios:
  - name: scen_demande_haute
    label: High demand
    results_dir: results/walloon/scen_demande_haute
    resources_dir: resources/walloon/scen_demande_haute
  - name: scen_corrige
    label: Corrected
    results_dir: results/walloon/scen_corrige
    resources_dir: resources/walloon/scen_corrige
  - name: scen_base
    label: Base
    results_dir: results/walloon/scen_base
    resources_dir: resources/walloon/scen_base
  - name: scen_nuc11500
    label: Nuclear 11500
    results_dir: results/walloon/scen_nuc11500
    resources_dir: resources/walloon/scen_nuc11500
  - name: scen_nuc13500
    label: Nuclear 13500
    results_dir: results/walloon/scen_nuc13500
    resources_dir: resources/walloon/scen_nuc13500
  - name: scen_imppel
    label: Imppel
    results_dir: results/walloon/scen_imppel
    resources_dir: resources/walloon/scen_imppel
  - name: scen_data
    label: Data
    results_dir: results/walloon/scen_data
    resources_dir: resources/walloon/scen_data
  - name: scen_evflex
    label: EV flexibility
    results_dir: results/walloon/scen_evflex
    resources_dir: resources/walloon/scen_evflex

  # --- September 2026 cabinet batch (docs/runs-20260912-cabinet-batch.md).
  # A scenario listed here but not solved yet is SKIPPED by
  # `generate_html_report_all_scenarios`, so the combined report can be
  # rebuilt after each scenario lands instead of only at the end.

  - name: scen_central
    label: Central
    results_dir: results/walloon/scen_central
    resources_dir: resources/walloon/scen_central
  - name: scen_taxshift
    label: Tax shift — single surcharge
    results_dir: results/walloon/scen_taxshift
    resources_dir: resources/walloon/scen_taxshift
  - name: scen_taxshift_plus
    label: Tax shift — full regional
    results_dir: results/walloon/scen_taxshift_plus
    resources_dir: resources/walloon/scen_taxshift_plus
  - name: scen_biomethane_industrie
    label: Biomethane reserved for industry
    results_dir: results/walloon/scen_biomethane_industrie
    resources_dir: resources/walloon/scen_biomethane_industrie
  - name: scen_realiste_nets
    label: Realistic 2030 — non-ETS kept
    results_dir: results/walloon/scen_realiste_nets
    resources_dir: resources/walloon/scen_realiste_nets
  - name: scen_realiste_nobnd30
    label: Realistic 2030 — no 2030 target
    results_dir: results/walloon/scen_realiste_nobnd30
    resources_dir: resources/walloon/scen_realiste_nobnd30
  - name: scen_retardnucleaire
    label: Nuclear delayed to 2055
    results_dir: results/walloon/scen_retardnucleaire
    resources_dir: resources/walloon/scen_retardnucleaire
  - name: scen_nuctip_9500
    label: Nuclear CAPEX 9500 EUR/kW
    results_dir: results/walloon/scen_nuctip_9500
    resources_dir: resources/walloon/scen_nuctip_9500
  - name: scen_nuctip_7500
    label: Nuclear CAPEX 7500 EUR/kW
    results_dir: results/walloon/scen_nuctip_7500
    resources_dir: resources/walloon/scen_nuctip_7500
  - name: scen_nuctip_6000
    label: Nuclear CAPEX 6000 EUR/kW
    results_dir: results/walloon/scen_nuctip_6000
    resources_dir: resources/walloon/scen_nuctip_6000
  - name: scen_nuctip_6500
    label: Nuclear CAPEX 6500 EUR/kW
    results_dir: results/walloon/scen_nuctip_6500
    resources_dir: resources/walloon/scen_nuctip_6500
  - name: scen_nuctip_5500
    label: Nuclear CAPEX 5500 EUR/kW
    results_dir: results/walloon/scen_nuctip_5500
    resources_dir: resources/walloon/scen_nuctip_5500
  - name: scen_nuctip_4500
    label: Nuclear CAPEX 4500 EUR/kW
    results_dir: results/walloon/scen_nuctip_4500
    resources_dir: resources/walloon/scen_nuctip_4500
  - name: scen_central_2013
    label: Central — weather year 2013
    results_dir: results/walloon_2013/scen_central_2013
    resources_dir: resources/walloon_2013/scen_central_2013

landing:
  scenario: scen_central
  node: BEWAL
  page: overview

output:
  dir: results/walloon/{scenario}/html/pypsa
  pages: [overview, emissions, sankeys, fec, demands, costs, capacities, dispatch, maps]
  shared_maps: true
  plotly: cdn

features:
  # Primary-energy independence: count nuclear as imported uranium (fuel is
  # not mined here, default) or as the electricity the reactors produce.
  # Accounting switch only — no 50 % Belgian-offshore attribution to Wallonia.
  nuclear_primary: uranium

